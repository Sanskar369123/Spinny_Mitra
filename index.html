<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spinny Mitra Voice Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: #0d0d0e;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Hidden iframe */
    #callkaro-frame {
      opacity: 0;
      width: 1px;
      height: 1px;
      position: absolute;
      pointer-events: none;
    }

    /* Main voice UI */
    .mitra-container {
      width: 350px;
      height: 580px;
      background: #111;
      border-radius: 30px;
      box-shadow: 0 0 45px rgba(0,0,0,0.5);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .mitra-orb {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 20%, #e0f2fe, #38bdf8, #1e3a8a);
      box-shadow: 0 0 60px rgba(30, 58, 138, 0.8);
      animation: float 5s ease-in-out infinite;
      margin-top: 20px;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
      100% { transform: translateY(0); }
    }

    .mitra-status {
      color: #d1d5db;
      margin-top: 22px;
      text-align: center;
      font-size: 1rem;
    }

    .action-row {
      margin-top: auto;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
    }

    .mic-btn,.close-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
    }

    .mic-btn {
      background: #22c55e;
      color: #042f18;
      box-shadow: 0 0 20px rgba(34,197,94,0.5);
    }

    .close-btn {
      background: #b91c1c;
      color: #fff;
      box-shadow: 0 0 20px rgba(185,28,28,0.5);
    }

  </style>
</head>
<body>

  <!-- Hidden CallKaro iframe -->
  <iframe 
    id="callkaro-frame"
    src="YOUR_CALLKARO_IFRAME_URL"
    allow="microphone; autoplay"
  ></iframe>

  <!-- Custom UI Overlay -->
  <div class="mitra-container">
    <div class="mitra-orb"></div>

    <div class="mitra-status" id="status">
      Ready to help you find your perfect car.
    </div>

    <div class="action-row">
      <div class="mic-btn" id="micBtn">🎤</div>
      <div class="close-btn" id="closeBtn">✕</div>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById("micBtn");
    const closeBtn = document.getElementById("closeBtn");
    const statusText = document.getElementById("status");

    micBtn.onclick = () => {
      statusText.textContent = "Listening…";
      // 🔥 You can trigger iframe functions via postMessage if CallKaro supports it
      // document.getElementById("callkaro-frame").contentWindow.postMessage(...)
    };

    closeBtn.onclick = () => {
      statusText.textContent = "Ending conversation…";
      setTimeout(() => {
        statusText.textContent = "Ready to help you again.";
      }, 1000);
    };

  </script>

</body>
</html>

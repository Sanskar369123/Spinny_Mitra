<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spinny + Spinny Mitra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Full-page Spinny website */
    #spinny-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Floating Spinny Mitra button */
    .mitra-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      background: #111827;
      color: #f9fafb;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    }

    .mitra-button-avatar {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: radial-gradient(circle at top left, #f97316, #e51640);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }

    .mitra-button-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .mitra-button-text-main {
      font-size: 13px;
      font-weight: 600;
    }

    .mitra-button-text-sub {
      font-size: 10px;
      color: #9ca3af;
    }

    .mitra-button-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.8);
    }

    /* Backdrop for widget */
    .mitra-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.8), rgba(3, 7, 18, 0.95));
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .mitra-backdrop.open {
      display: flex;
    }

    /* Voice-mode style container */
    .mitra-shell {
      width: 100%;
      max-width: 720px;
      height: 100%;
      max-height: 620px;
      border-radius: 32px;
      background: radial-gradient(circle at top, #020617, #020617 40%, #020617 70%, #020617 100%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(148, 163, 184, 0.4);
      position: relative;
    }

    /* Glow ring background */
    .mitra-shell::before {
      content: "";
      position: absolute;
      inset: -120px;
      background:
        radial-gradient(circle at top, rgba(248, 250, 252, 0.18), transparent 60%),
        radial-gradient(circle at bottom right, rgba(244, 63, 94, 0.2), transparent 60%),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.35), transparent 60%);
      opacity: 0.8;
      pointer-events: none;
    }

    .mitra-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 18px 20px 20px;
    }

    /* Top header with name & close */
    .mitra-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .mitra-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mitra-header-avatar {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: radial-gradient(circle at top left, #f97316, #e51640);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 0 18px rgba(248, 113, 113, 0.8);
    }

    .mitra-header-text-main {
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .mitra-header-text-sub {
      font-size: 11px;
      color: #9ca3af;
    }

    .mitra-close {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    /* Voice-mode center area */
    .mitra-voice-area {
      flex-shrink: 0;
      padding: 10px 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mitra-orb-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mitra-orb-pulse {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.12), transparent 70%);
      animation: orbPulse 2.4s ease-out infinite;
    }

    .mitra-orb-main {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 999px;
      background: conic-gradient(from 210deg, #22c55e, #0ea5e9, #e51640, #f97316, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 40px rgba(56, 189, 248, 0.6),
        0 0 80px rgba(239, 68, 68, 0.6);
    }

    .mitra-orb-inner {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      background: radial-gradient(circle at top, #020617, #020617 55%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
      font-size: 40px;
    }

    .mitra-status-main {
      font-size: 14px;
      font-weight: 500;
      color: #e5e7eb;
      text-align: center;
    }

    .mitra-status-sub {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }

    .mitra-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }

    .mitra-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: #9ca3af;
      animation: dotBlink 1.4s infinite ease-in-out;
    }

    .mitra-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .mitra-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* Agent iframe area */
    .mitra-agent-shell {
      flex: 1;
      margin-top: 8px;
      border-radius: 20px;
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 1));
      border: 1px solid rgba(55, 65, 81, 0.7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mitra-agent-header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #9ca3af;
      border-bottom: 1px solid rgba(55, 65, 81, 0.8);
    }

    .mitra-agent-header span:first-child {
      color: #e5e7eb;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mitra-agent-badge {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      font-size: 10px;
    }

    .mitra-agent-frame-wrap {
      flex: 1;
      background: #020617;
    }

    .mitra-agent-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Bottom hint */
    .mitra-footer-hint {
      font-size: 10px;
      color: #6b7280;
      text-align: center;
      margin-top: 8px;
    }

    @keyframes orbPulse {
      0% {
        transform: scale(0.9);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.06);
        opacity: 0.2;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.45;
      }
    }

    @keyframes dotBlink {
      0%, 80%, 100% {
        opacity: 0.3;
      }
      40% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .mitra-shell {
        max-width: 100%;
        max-height: 100%;
        height: 100%;
        border-radius: 0;
      }
      .mitra-inner {
        padding: 14px 14px 16px;
      }
      .mitra-orb-wrap {
        width: 150px;
        height: 150px;
      }
      .mitra-orb-main {
        width: 120px;
        height: 120px;
      }
      .mitra-orb-inner {
        width: 80px;
        height: 80px;
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <!-- Real Spinny site -->
  <iframe
    id="spinny-frame"
    src="https://www.spinny.com"
    title="Spinny website"
  ></iframe>

  <!-- Floating Spinny Mitra button -->
  <button class="mitra-button" id="mitra-toggle">
    <div class="mitra-button-avatar">M</div>
    <div class="mitra-button-text">
      <span class="mitra-button-text-main">Spinny Mitra</span>
      <span class="mitra-button-text-sub">Tap to talk about cars</span>
    </div>
    <div class="mitra-button-dot"></div>
  </button>

  <!-- Voice-mode style Spinny Mitra shell -->
  <div class="mitra-backdrop" id="mitra-backdrop">
    <div class="mitra-shell">
      <div class="mitra-inner">
        <!-- Header -->
        <div class="mitra-header">
          <div class="mitra-header-left">
            <div class="mitra-header-avatar">M</div>
            <div>
              <div class="mitra-header-text-main">Spinny Mitra</div>
              <div class="mitra-header-text-sub">Your AI car buying expert</div>
            </div>
          </div>
          <button class="mitra-close" id="mitra-close" aria-label="Close">×</button>
        </div>

        <!-- Voice-like centre area -->
        <div class="mitra-voice-area">
          <div class="mitra-orb-wrap">
            <div class="mitra-orb-pulse"></div>
            <div class="mitra-orb-main">
              <div class="mitra-orb-inner">
                🎙️
              </div>
            </div>
          </div>
          <div class="mitra-status-main">
            Ready to help you choose a car
            <span class="mitra-dots">
              <span class="mitra-dot"></span>
              <span class="mitra-dot"></span>
              <span class="mitra-dot"></span>
            </span>
          </div>
          <div class="mitra-status-sub">
            Ask about budget, fuel type, family size, city, EMI – whatever you’d ask a real Spinny expert.
          </div>
        </div>

        <!-- Agent frame (your backend UI) -->
        <div class="mitra-agent-shell">
          <div class="mitra-agent-header">
            <span>Spinny Mitra session</span>
            <span class="mitra-agent-badge">AI · Voice & Chat</span>
          </div>
          <div class="mitra-agent-frame-wrap">
            <!-- 🔴 IMPORTANT: Only backend URL here, no branding -->
            <iframe
              class="mitra-agent-frame"
              src="https://callkaro.ai/chatkaro/691d6205fceaffa5d86a526f"
              allow="microphone; autoplay"
              title="Spinny Mitra assistant"
            ></iframe>
          </div>
        </div>

        <div class="mitra-footer-hint">
          Tip: Speak naturally or type into the assistant. This is an experimental AI experience.
        </div>
      </div>
    </div>
  </div>

  <script>
    const mitraToggle = document.getElementById('mitra-toggle');
    const mitraBackdrop = document.getElementById('mitra-backdrop');
    const mitraClose = document.getElementById('mitra-close');

    function openMitra() {
      mitraBackdrop.classList.add('open');
    }

    function closeMitra() {
      mitraBackdrop.classList.remove('open');
    }

    mitraToggle.addEventListener('click', openMitra);
    mitraClose.addEventListener('click', closeMitra);

    // Close when clicking around the shell (outside the card)
    mitraBackdrop.addEventListener('click', (e) => {
      if (e.target === mitraBackdrop) {
        closeMitra();
      }
    });
  </script>
</body>
</html>
